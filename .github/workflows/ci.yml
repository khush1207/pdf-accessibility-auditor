name: ci-cd

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: pytest
        working-directory: backend

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit pip-audit
      - name: Static analysis
        run: bandit -r backend/app -ll
      - name: Dependency vulnerability scan
        run: pip-audit -r backend/requirements.txt

  build:
    needs: [test, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t pdf-access-auditor .
      - run: |
          docker run -d -p 8000:8000 --name app pdf-access-auditor
          sleep 5
          curl --fail http://localhost:8000/api/health

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: curl --fail --silent -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

      - name: Wait for the live service
        run: |
          sleep 60
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error "${{ vars.RENDER_URL }}/api/health"; then
              echo
              exit 0
            fi
            sleep 10
          done
          echo "Render health check failed after repeated attempts."
          exit 1

