
name: ci-cd

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: pytest
        working-directory: backend

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit pip-audit
      - name: Static analysis
        run: bandit -r backend/app -ll
      - name: Dependency vulnerability scan
        run: pip-audit -r backend/requirements.txt

  build:
    needs: [test, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t pdf-access-auditor .
      - run: |
          docker run -d -p 8000:8000 --name app pdf-access-auditor
          sleep 5
          curl --fail http://localhost:8000/api/health

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-north-1

      - name: Deploy to EC2 through SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0ed0793a87305f463 \
            --document-name AWS-RunShellScript \
            --comment "GitHub Actions deployment" \
            --parameters 'commands=["cd /home/ubuntu/pdf-accessibility-auditor && git pull --ff-only origin main && docker compose up -d --build --remove-orphans"]' \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id i-0ed0793a87305f463 \
              --query 'Status' \
              --output text 2>/dev/null || true)

            echo "Deployment status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              exit 0
            fi

            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id i-0ed0793a87305f463 \
                --query 'StandardErrorContent' \
                --output text || true
              exit 1
            fi

            sleep 10
          done

          echo "Deployment timed out while waiting for SSM."
          exit 1

      - name: Verify live health endpoint
        run: |
          for i in $(seq 1 12); do
            if curl --fail --silent --show-error https://13.60.46.33/api/health; then
              echo
              exit 0
            fi
            sleep 5
          done
          echo "EC2 health check failed."
          exit 1
