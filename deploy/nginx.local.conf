pid /tmp/nginx-lb.pid;
worker_processes 1;
error_log /tmp/nginx-lb-error.log;
events { worker_connections 256; }

http {
  access_log /tmp/nginx-lb-access.log;
  client_body_temp_path /tmp/nginx-body;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;

  upstream auditor {
    server 127.0.0.1:8001 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:8002 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:8003 max_fails=2 fail_timeout=10s;
  }

  server {
    listen 8080;
    client_max_body_size 21m;
    location / {
      proxy_pass http://auditor;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_next_upstream error timeout http_502 http_503;
      proxy_connect_timeout 3s;
      proxy_read_timeout 90s;
      add_header X-Upstream $upstream_addr always;
    }
  }
}
