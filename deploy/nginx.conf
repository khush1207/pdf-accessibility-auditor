worker_processes 1;
events { worker_connections 256; }

http {
  upstream auditor {
    # round robin is the default. Alternatives: least_conn; or ip_hash;
    server app1:8000 max_fails=2 fail_timeout=10s;
    server app2:8000 max_fails=2 fail_timeout=10s;
    server app3:8000 max_fails=2 fail_timeout=10s;
  }

  server {
    listen 8080;
    client_max_body_size 21m;

    location / {
      proxy_pass http://auditor;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_next_upstream error timeout http_502 http_503;
      proxy_connect_timeout 3s;
      proxy_read_timeout 90s;
      add_header X-Upstream $upstream_addr always;
    }
  }
}
