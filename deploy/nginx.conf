worker_processes 1;
events { worker_connections 256; }

http {
  upstream auditor {
    server app1:8000 max_fails=2 fail_timeout=10s;
    server app2:8000 max_fails=2 fail_timeout=10s;
    server app3:8000 max_fails=2 fail_timeout=10s;
  }

  # HTTP: keep certificate renewal accessible
  server {
    listen 8080;
    client_max_body_size 21m;

    location ^~ /.well-known/acme-challenge/ {
      root /var/www/certbot;
      default_type text/plain;
      try_files $uri =404;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # HTTPS
  server {
    listen 443 ssl;
    server_name 13.60.46.33;

    ssl_certificate /etc/letsencrypt/live/13.60.46.33/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/13.60.46.33/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 21m;

    location / {
      proxy_pass http://auditor;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_next_upstream error timeout http_502 http_503;
      proxy_connect_timeout 3s;
      proxy_read_timeout 90s;
      add_header X-Upstream $upstream_addr always;
    }
  }
}
