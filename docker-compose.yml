x-app: &app
  build: .
  restart: unless-stopped
  environment:
    SESSION_SECRET: change-me-to-a-long-random-value-of-32-chars-or-more
    RATE_LIMIT_PER_MINUTE: "1000"
    PRODUCTION: "1"

services:
  app1:
    <<: *app
    hostname: app1
  app2:
    <<: *app
    hostname: app2
  app3:
    <<: *app
    hostname: app3
  lb:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
      - app3
